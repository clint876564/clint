<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 34px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .card {
      background: #202020;
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #ddd;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 9px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #333;
      color: white;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin-top: 15px;
      line-height: 1.4;
    }

    .success {
      display: block;
      background: #123d24;
      color: #8ff0b0;
    }

    .error {
      display: block;
      background: #451b1b;
      color: #ff9999;
    }

    .hidden {
      display: none;
    }

    .user-email {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .preview {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin-top: 15px;
      border: 2px solid #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <section id="loginSection">

      <h1>Admin Login</h1>
      <p class="subtitle">Manage your portfolio website</p>

      <div class="card">

        <h2>Login</h2>

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Your email"
          autocomplete="email"
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Your password"
          autocomplete="current-password"
        >

        <button id="loginButton">
          LOGIN
        </button>

        <div id="loginMessage" class="message"></div>

      </div>

    </section>


    <!-- ADMIN DASHBOARD -->
    <section id="adminSection" class="hidden">

      <h1>Portfolio Admin</h1>

      <p class="subtitle">
        Edit your website without touching the code.
      </p>

      <div class="card">

        <h2>Account</h2>

        <div class="user-email" id="loggedInEmail"></div>

      </div>


      <!-- PROFILE -->
      <div class="card">

        <h2>Profile</h2>

        <label for="profileImage">
          Profile Picture URL
        </label>

        <input
          type="url"
          id="profileImage"
          placeholder="https://..."
        >

        <img
          id="profilePreview"
          class="preview"
          alt="Profile preview"
        >

        <label for="name">
          Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Your name"
        >

        <label for="title">
          Professional Title
        </label>

        <input
          type="text"
          id="title"
          placeholder="Video Editor"
        >

        <label for="location">
          Location
        </label>

        <input
          type="text"
          id="location"
          placeholder="Lagos"
        >

        <label for="experience">
          Experience
        </label>

        <input
          type="text"
          id="experience"
          placeholder="5 YEARS EXP"
        >

        <label for="availability">
          Availability
        </label>

        <input
          type="text"
          id="availability"
          placeholder="AVAILABLE"
        >

        <label for="bio">
          Bio
        </label>

        <textarea
          id="bio"
          placeholder="Tell people about yourself..."
        ></textarea>

      </div>


      <!-- SOCIAL MEDIA -->
      <div class="card">

        <h2>Social Media</h2>

        <label for="instagram">
          Instagram
        </label>

        <input
          type="url"
          id="instagram"
          placeholder="https://instagram.com/..."
        >

        <label for="twitter">
          Twitter / X
        </label>

        <input
          type="url"
          id="twitter"
          placeholder="https://x.com/..."
        >

        <label for="tiktok">
          TikTok
        </label>

        <input
          type="url"
          id="tiktok"
          placeholder="https://tiktok.com/@..."
        >

        <label for="youtube">
          YouTube
        </label>

        <input
          type="url"
          id="youtube"
          placeholder="https://youtube.com/@..."
        >

        <label for="whatsapp">
          WhatsApp
        </label>

        <input
          type="url"
          id="whatsapp"
          placeholder="https://wa.me/..."
        >

      </div>


      <div class="card">

        <button id="saveButton">
          SAVE CHANGES
        </button>

        <div id="saveMessage" class="message"></div>

        <button id="logoutButton" class="logout">
          LOGOUT
        </button>

      </div>

    </section>

  </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /*
   * SUPABASE CONFIGURATION
   */

  const SUPABASE_URL =
    "https://bblobogsraomttvhkmbt.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_QTythwATWPkXCx8MgceeTw_xk0IN81b";


  /*
   * CREATE SUPABASE CLIENT
   */

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /*
   * ELEMENTS
   */

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const saveButton =
    document.getElementById("saveButton");

  const saveMessage =
    document.getElementById("saveMessage");

  const logoutButton =
    document.getElementById("logoutButton");

  const loggedInEmail =
    document.getElementById("loggedInEmail");

  const profileImage =
    document.getElementById("profileImage");

  const profilePreview =
    document.getElementById("profilePreview");

  const nameInput =
    document.getElementById("name");

  const titleInput =
    document.getElementById("title");

  const locationInput =
    document.getElementById("location");

  const experienceInput =
    document.getElementById("experience");

  const availabilityInput =
    document.getElementById("availability");

  const bioInput =
    document.getElementById("bio");

  const instagramInput =
    document.getElementById("instagram");

  const twitterInput =
    document.getElementById("twitter");

  const tiktokInput =
    document.getElementById("tiktok");

  const youtubeInput =
    document.getElementById("youtube");

  const whatsappInput =
    document.getElementById("whatsapp");


  /*
   * MESSAGE HELPERS
   */

  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

  }


  function clearMessage(element) {

    element.textContent = "";

    element.className =
      "message";

  }


  /*
   * SHOW / HIDE ADMIN
   */

  function showAdmin(user) {

    loginSection.classList.add("hidden");

    adminSection.classList.remove("hidden");

    loggedInEmail.textContent =
      "Logged in as: " + user.email;

  }


  function showLogin() {

    adminSection.classList.add("hidden");

    loginSection.classList.remove("hidden");

  }


  /*
   * LOGIN
   */

  async function login() {

    clearMessage(loginMessage);

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    if (!email || !password) {

      showMessage(
        loginMessage,
        "Please enter your email and password.",
        "error"
      );

      return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
      "LOGGING IN...";

    try {

      const { data, error } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error(
          "Login failed. No user was returned."
        );
      }

      showAdmin(data.user);

      await loadProfile(data.user);

    } catch (error) {

      console.error("LOGIN ERROR:", error);

      showMessage(
        loginMessage,
        error.message || "Login failed.",
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "LOGIN";

    }

  }


  /*
   * LOAD PROFILE
   */

  async function loadProfile(user) {

    try {

      const { data, error } =
        await db
          .from("profiles")
          .select("*")
          .eq("id", user.id)
          .maybeSingle();

      if (error) {
        throw error;
      }

      /*
       * No profile yet.
       * That's okay.
       */

      if (!data) {

        clearForm();

        return;

      }

      profileImage.value =
        data.profile_image || "";

      nameInput.value =
        data.name || "";

      titleInput.value =
        data.title || "";

      locationInput.value =
        data.location || "";

      experienceInput.value =
        data.experience || "";

      availabilityInput.value =
        data.availability || "";

      bioInput.value =
        data.bio || "";

      instagramInput.value =
        data.instagram || "";

      twitterInput.value =
        data.twitter || "";

      tiktokInput.value =
        data.tiktok || "";

      youtubeInput.value =
        data.youtube || "";

      whatsappInput.value =
        data.whatsapp || "";

      updatePreview();

    } catch (error) {

      console.error(
        "PROFILE LOAD ERROR:",
        error
      );

      showMessage(
        saveMessage,
        "Could not load profile data: " +
        error.message,
        "error"
      );

    }

  }


  /*
   * CLEAR FORM
   */

  function clearForm() {

    profileImage.value = "";

    nameInput.value = "";

    titleInput.value = "Video Editor";

    locationInput.value = "";

    experienceInput.value = "";

    availabilityInput.value = "AVAILABLE";

    bioInput.value = "";

    instagramInput.value = "";

    twitterInput.value = "";

    tiktokInput.value = "";

    youtubeInput.value = "";

    whatsappInput.value = "";

    updatePreview();

  }


  /*
   * PROFILE IMAGE PREVIEW
   */

  function updatePreview() {

    const url =
      profileImage.value.trim();

    if (!url) {

      profilePreview.style.display =
        "none";

      profilePreview.removeAttribute(
        "src"
      );

      return;

    }

    profilePreview.src = url;

    profilePreview.style.display =
      "block";

  }


  profileImage.addEventListener(
    "input",
    updatePreview
  );


  /*
   * SAVE PROFILE
   */

  async function saveProfile() {

    clearMessage(saveMessage);

    saveButton.disabled = true;

    saveButton.textContent =
      "SAVING...";

    try {

      const {
        data: sessionData,
        error: sessionError
      } = await db.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      const session =
        sessionData.session;

      if (!session || !session.user) {

        throw new Error(
          "You are not logged in."
        );

      }

      const user =
        session.user;


      const profile = {

        id: user.id,

        name:
          nameInput.value.trim(),

        title:
          titleInput.value.trim(),

        location:
          locationInput.value.trim(),

        experience:
          experienceInput.value.trim(),

        availability:
          availabilityInput.value.trim(),

        bio:
          bioInput.value.trim(),

        profile_image:
          profileImage.value.trim(),

        instagram:
          instagramInput.value.trim(),

        twitter:
          twitterInput.value.trim(),

        tiktok:
          tiktokInput.value.trim(),

        youtube:
          youtubeInput.value.trim(),

        whatsapp:
          whatsappInput.value.trim(),

        email:
          user.email || "",

        updated_at:
          new Date().toISOString()

      };


      const { error } =
        await db
          .from("profiles")
          .upsert(
            profile,
            {
              onConflict: "id"
            }
          );


      if (error) {
        throw error;
      }


      showMessage(
        saveMessage,
        "Saved successfully!",
        "success"
      );


    } catch (error) {

      console.error(
        "SAVE ERROR:",
        error
      );

      showMessage(
        saveMessage,
        "Could not save: " +
        error.message,
        "error"
      );

    } finally {

      saveButton.disabled = false;

      saveButton.textContent =
        "SAVE CHANGES";

    }

  }


  /*
   * LOGOUT
   */

  async function logout() {

    await db.auth.signOut();

    clearForm();

    passwordInput.value = "";

    showLogin();

  }


  /*
   * BUTTON EVENTS
   */

  loginButton.addEventListener(
    "click",
    login
  );

  saveButton.addEventListener(
    "click",
    saveProfile
  );

  logoutButton.addEventListener(
    "click",
    logout
  );


  /*
   * ALLOW ENTER TO LOGIN
   */

  passwordInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        login();

      }

    }
  );


  /*
   * CHECK EXISTING LOGIN
   */

  async function checkSession() {

    try {

      const {
        data,
        error
      } = await db.auth.getSession();

      if (error) {
        throw error;
      }

      if (
        data.session &&
        data.session.user
      ) {

        showAdmin(
          data.session.user
        );

        await loadProfile(
          data.session.user
        );

      } else {

        showLogin();

      }

    } catch (error) {

      console.error(
        "SESSION ERROR:",
        error
      );

      showLogin();

      showMessage(
        loginMessage,
        "Could not connect to Supabase: " +
        error.message,
        "error"
      );

    }

  }


  /*
   * START
   */

  checkSession();

</script>

</body>
</html>
